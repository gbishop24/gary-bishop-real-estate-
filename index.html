<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Get a free, no-pressure home value estimate from Gary Bishop, a local REALTOR® serving Putnam County, FL, including Palatka, Interlachen, Crescent City, Florahome, Welaka and Pomona Park."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Gary Bishop, REALTOR® | Coldwell Banker Ben Bates, Inc.</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Static forms for Netlify Forms detection at deploy time (SPA). -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" />
      <input name="phone" />
      <input name="country" />
      <input name="address1" />
      <input name="address2" />
      <input name="city" />
      <input name="state" />
      <input name="zip" />
      <input name="timeline" />
      <input name="consent" />
      <textarea name="notes"></textarea>
    </form>
    <form name="buyers" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="buyers" />
      <input name="bot-field" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" />
      <input name="phone" />
      <input name="areas" />
      <input name="priceRange" />
      <input name="timeframe" />
      <input name="preapproved" />
      <textarea name="comments"></textarea>
      <input name="consent" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
